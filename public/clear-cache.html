<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تنظيف الكاش - قيراط</title>
<style>
  body { background: #09090B; color: #FCF9F3; font-family: 'Tajawal', sans-serif;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 100vh; margin: 0; gap: 16px; text-align: center; padding: 20px; }
  h1 { color: #A08965; font-size: 22px; }
  p  { color: #A1A1AA; font-size: 14px; }
  .spinner { width: 40px; height: 40px; border: 3px solid #27272A;
             border-top-color: #A08965; border-radius: 50%;
             animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<h1>جاري تنظيف الكاش...</h1>
<p>سيتم تحميل أحدث نسخة من التطبيق تلقائياً</p>
<script>
async function clearEverything() {
  // Unregister all service workers
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  // Clear all caches
  const keys = await caches.keys();
  await Promise.all(keys.map(k => caches.delete(k)));
  // Redirect to home with no-cache
  setTimeout(() => {
    window.location.replace('/?t=' + Date.now());
  }, 1200);
}
clearEverything();
</script>
</body>
</html>
